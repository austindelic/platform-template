<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Platform starter</title>
  <desc id="desc">A starter for internal web apps on Cloudflare: a SvelteKit web Worker behind Access, a private jobs Worker with Durable Objects, Postgres through Hyperdrive, R2 storage when a feature needs it, and a static Astro handbook.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#1C222C"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3A4352"/>
    </marker>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2EC4B6" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="440" rx="24" fill="#0D1016"/>
  <rect width="1280" height="440" rx="24" fill="url(#dots)"/>
  <rect x="630" y="36" width="630" height="368" rx="20" fill="url(#glow)"/>

  <g>
