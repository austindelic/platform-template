    <rect x="1090" y="290" width="160" height="58" rx="12" fill="#151A22" stroke="#2A323F" stroke-width="1.5"/>
    <text x="1106" y="315" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#F2F0EA">R2</text>
