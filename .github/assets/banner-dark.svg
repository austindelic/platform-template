  <text x="62" y="196" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="760" letter-spacing="-1.5" fill="#F2F0EA">Platform starter</text>
  <text x="64" y="240" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#9AA3B2">Internal web apps on Cloudflare, with the</text>
  <text x="64" y="270" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#9AA3B2">boring, risky parts <tspan fill="#FF8A3D" font-weight="650">already wired up.</tspan></text>
