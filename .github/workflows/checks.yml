name: Checks
# Runs on Blacksmith runners (billed to Blacksmith, not the org's Actions minutes; actions/cache is
# served from Blacksmith's colocated cache). One sequential job that stops at the first failure,
# skipped for drafts and for docs- or OpenTofu-only changes (infra.yml checks those), cancelled
# when a newer push to the same PR arrives. Callable from deploy.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "*.md"
      - "**/README.md"
      - "docs/**"
      - "infra/cloud/**"
      - ".github/workflows/infra.yml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
env:
  # Only the tools these checks use.
  MISE_DISABLE_TOOLS: infisical,opentofu
jobs:
  checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          env: false
          export_path: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: mise exec -- bun install --frozen-lockfile
      - run: mise exec -- bun run fmt:check
      # check generates the .svelte-kit and .astro types that type-aware lint reads.
      - run: mise exec -- bun run check
      - run: mise exec -- bun run lint
      - run: mise exec -- bun run test
      - run: mise exec -- bun run build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install browser
        run: mise exec -- bunx playwright install --with-deps chromium
      - name: Browser tests
        run: mise exec -- bun run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
